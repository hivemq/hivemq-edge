get:
  description: Begin the OIDC authorization-code flow. Mints a fresh state, nonce, and PKCE challenge and returns the Identity Provider authorization URL for the SPA to open. The SPA opens this URL in the login popup, rather than this endpoint redirecting, so that a start-time failure is a normal error response the SPA can present instead of a stranded popup.
  operationId: oidc-login
  x-roles-allowed:
    - NO_AUTH_REQUIRED
  responses:
    '200':
      content:
        application/json:
          schema:
            $ref: ../components/schemas/OidcLoginRedirect.yaml
      description: The Identity Provider authorization URL to open.
    '503':
      content:
        application/problem+json:
          schema:
            $ref: ../components/schemas/ProblemDetails.yaml
      description: OIDC is not configured on this instance, or the Identity Provider could not be reached. The `detail` field distinguishes the two.
  summary: Begin the OIDC login flow.
  tags:
    - Authentication
    - Authentication Endpoint
