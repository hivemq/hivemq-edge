type: object
description: List of result items that are returned by this endpoint
properties:
  fieldMapping:
    $ref: ./FieldMapping.yaml
  tagName:
    type: string
    format: mqtt-tag
    description: The tag for which values hould be collected and sent out.
  topicFilter:
    type: string
    description: The filter defining what topics we will receive messages from.
  methodCalls:
    type: boolean
    default: false
    description: >-
      Whether messages on this mapping are method calls. When enabled, each message must name the
      method to call in 'methodName', and that method is called on the tag's object. Required for a
      method tag: without it the request fields are left out of the transform, so a message cannot
      name its method and the call is refused.
  correlationData:
    type: boolean
    default: false
    description: >-
      Whether requests carry a correlation token in 'correlationData', which is read and echoed
      unchanged on the response. A field that is not enabled is discarded rather than passed on.
  responseTopic:
    type: boolean
    default: false
    description: >-
      Whether requests may name their own response topic in 'responseTopic'. This is the only
      setting involved: with it enabled a request's response goes to the address the request named,
      instead of the northbound mapping's own topic. A field that is not enabled is discarded rather
      than passed on.
required:
  - tagName
  - topicFilter
