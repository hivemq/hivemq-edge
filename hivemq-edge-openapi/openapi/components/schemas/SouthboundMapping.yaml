type: object
description: List of result items that are returned by this endpoint
properties:
  fieldMapping:
    $ref: ./FieldMapping.yaml
  tagName:
    type: string
    format: mqtt-tag
    description: The tag for which values hould be collected and sent out.
  topicFilter:
    type: string
    description: The filter defining what topics we will receive messages from.
  methodCalls:
    type: boolean
    default: false
    description: >-
      Whether messages on this mapping are method calls. When enabled, each message must name the
      method to call in 'methodName', and that method is called on the tag's object. Required for a
      method tag; without it a message is treated as an ordinary value write.
  correlationData:
    type: boolean
    default: false
    description: >-
      Whether requests carry a correlation token in 'correlationData', which is read and echoed
      unchanged on the response. A field that is not enabled is discarded rather than passed on.
  responseTopic:
    type: boolean
    default: false
    description: >-
      Whether requests may name their own response topic in 'responseTopic'. Only has an effect when
      the northbound mapping is also configured to publish to the address the request carried.
required:
  - tagName
  - topicFilter
