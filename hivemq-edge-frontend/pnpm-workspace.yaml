minimumReleaseAge: 0
allowBuilds:
  '@parcel/watcher': true
  '@percy/core': true
  '@sentry/cli': true
  cypress: true
  esbuild: true
  msw: true
  protobufjs: true
overrides:
  minimatch@3: 10.2.6
  minimatch@8: 10.2.6
  minimatch@9: 10.2.6
  minimatch@10: 10.2.6
  flatted: 3.4.3
  ajv@>=8 <9: ^8.20.0
  immutable: ^5.1.5
  brace-expansion@^1: ^5.0.0
  brace-expansion@^2: ^5.0.0
  brace-expansion@^5: ^5.0.9
  lodash: ^4.18.0
  lodash-es: ^4.18.0
  picomatch@^4: ^4.0.4
  qs@^6: ^6.15.2
  rollup@^4: ^4.57.1
  dompurify@>=3 <4: ^3.4.1
  markdown-it: ^14.1.1
  postcss@^8: ^8.5.18
  nanoid@^3: ^5.1.16
  '@babel/core@^7': ^7.29.7
  yaml@^1: ^2.0.0
  yaml@^2: ^2.8.3
  js-yaml@^3: ^5.2.2
  js-yaml@^4: ^5.2.2
  follow-redirects: ^1.16.0
  ws@^8: ^8.20.1
  fast-uri@^3: ^4.0.0
  systeminformation@^5: ^5.31.6
  ip-address: ^10.1.1
  '@protobufjs/utf8': ^1.1.1
  '@protobufjs/codegen': ^2.0.5
  uuid@^11: ^14.0.0
  # ProseMirror does instanceof checks across its own classes, so tiptap breaks with
  # "Can not convert <mention> to a Fragment (looks like multiple versions of prosemirror-model
  # were loaded)" as soon as two copies are resolved. Keep it to one.
  prosemirror-model: ^1.25.11
  # The plugin accepts zod-validation-error ^3.5.0 || ^4.0.0 but only ever imports the
  # v4-only 'zod-validation-error/v4' subpath; left alone, pnpm reuses the 3.x copy that
  # langbase pulls in and ESLint dies with ERR_PACKAGE_PATH_NOT_EXPORTED.
  'eslint-plugin-react-hooks>zod-validation-error': ^4.0.0
