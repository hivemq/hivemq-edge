name: Run Snyk scan on PRs

on:
  pull_request:
    branches:
      - master**

jobs:
#  monitor-baseline-project:
#    uses: ./.github/workflows/snyk-push.yml
#    with:
#      github_ref: ${{ github.base_ref }}
#    secrets: inherit

  scan-for-new-issues:
    runs-on: ubuntu-latest
#    needs: monitor-baseline-project

    steps:
      - name: Setup Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: 'temurin'
          java-version: |
            25

      - uses: hivemq/hivemq-checkout-composite-action@c7f25775479e7e1a24566ad301f35c88e0a3dbe7 # v1
        with:
          path: hivemq-edge
          ref: ${{ steps.select_github_ref.outputs.selected_github_ref }}
          token: ${{ secrets.JENKINS_GITHUB_TOKEN }}

      - name: Check for new issues
        uses: hivemq/hivemq-snyk-composite-action@964ecf88d2ca59af77cc2718d2a79503479b762e # v2.3.7
        with:
          snyk-args: --org=hivemq-edge --configuration-matching=^runtimeClasspath$ -d hivemq-edge/hivemq-edge
          artifact-name: snyk-report-hivemq-edge
          snyk-token: ${{ secrets.SNYK_TOKEN }}
          github-username: ${{ secrets.JENKINS_GITHUB_USERNAME }}
          github-token: ${{ secrets.JENKINS_GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24.16.0'

      # Snyk only needs pnpm-lock.yaml (overrides are already resolved into it). When a
      # pnpm-workspace.yaml sits next to the lockfile, the Snyk pnpm plugin treats the dir
      # as a workspace and refuses to scan unless --all-projects is passed, but that flag
      # makes Snyk emit a JSON array which the composite action's single-project parser
      # (jq '.org') cannot read. Removing the (settings-only) workspace file from this
      # throwaway CI checkout lets Snyk auto-detect the single pnpm project again.
      - name: Hide pnpm-workspace.yaml from the Snyk pnpm scan
        run: rm -f hivemq-edge/hivemq-edge-frontend/pnpm-workspace.yaml

      - name: Check for new issues (hivemq-edge-frontend)
        uses: hivemq/hivemq-snyk-composite-action@964ecf88d2ca59af77cc2718d2a79503479b762e # v2.3.7
        with:
          snyk-args: --org=hivemq-edge --configuration-matching=^runtimeClasspath$ -d hivemq-edge/hivemq-edge-frontend
          artifact-name: snyk-report-hivemq-edge-frontend
          snyk-token: ${{ secrets.SNYK_TOKEN }}
          github-username: ${{ secrets.JENKINS_GITHUB_USERNAME }}
          github-token: ${{ secrets.JENKINS_GITHUB_TOKEN }}
