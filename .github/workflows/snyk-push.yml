name: Run Snyk monitor on push

on:
  push:
    branches:
      - master**
  workflow_call:
    inputs:
      github_ref:
        required: true
        type: string

jobs:
  run-snyk-monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Select GitHub ref
        id: select_github_ref
        shell: bash
        run: |
          workflow_call_github_ref=${{ inputs.github_ref }}
          echo "selected_github_ref=${workflow_call_github_ref:-${{ github.ref_name }}}" >> "$GITHUB_OUTPUT"

      - name: Setup Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: 'temurin'
          java-version: |
            25

      - uses: hivemq/hivemq-checkout-composite-action@c7f25775479e7e1a24566ad301f35c88e0a3dbe7 # v1
        with:
          path: hivemq-edge
          ref: ${{ steps.select_github_ref.outputs.selected_github_ref }}
          token: ${{ secrets.JENKINS_GITHUB_TOKEN }}

      - name: Setup Snyk
        uses: snyk/actions/setup@11b673cfb4b0dc0d860a1323caa199d54950dcce # master

      - name: Run Snyk monitor
        shell: bash
        run: >
          snyk monitor --configuration-matching=^runtimeClasspath$ --target-reference=${{ steps.select_github_ref.outputs.selected_github_ref }} --org=hivemq-edge
          --project-name=hivemq-edge --remote-repo-url=hivemq-edge --project-lifecycle=development -d
          hivemq-edge/hivemq-edge -- --stacktrace
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24.16.0'

      # Snyk only needs pnpm-lock.yaml (overrides are already resolved into it). When a
      # pnpm-workspace.yaml sits next to the lockfile, the Snyk pnpm plugin treats the dir
      # as a workspace and refuses to scan unless --all-projects is passed, but that flag
      # cannot be combined with --project-name (SNYK-CLI-0004), and --project-name is what
      # names this project in the Snyk dashboard. Removing the (settings-only) workspace
      # file from this throwaway CI checkout lets Snyk auto-detect the single pnpm project
      # again. Same treatment as snyk-pr.yml.
      - name: Hide pnpm-workspace.yaml from the Snyk pnpm scan
        run: rm -f hivemq-edge/hivemq-edge-frontend/pnpm-workspace.yaml

      - name: Run Snyk Frontend monitor
        shell: bash
        run: >
          snyk monitor --target-reference=${{ steps.select_github_ref.outputs.selected_github_ref }} --org=hivemq-edge
          --project-name=hivemq-edge-frontend --remote-repo-url=hivemq-edge-frontend --project-lifecycle=development -d
          hivemq-edge/hivemq-edge-frontend
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.JENKINS_GITHUB_TOKEN }}
          GH_NPM_TOKEN: ${{ secrets.JENKINS_GITHUB_TOKEN }}
